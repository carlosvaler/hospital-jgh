<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Admin Hospital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; border: 1px solid #e2e8f0;">
        
        <div style="text-align: center; margin-bottom: 25px;">
            <!-- Imagen real de la fachada del hospital reemplazando al emoji -->
            <img src="{{ url_for('static', filename='img/hospital_fachada.jpg') }}" alt="Hospital JGH" style="width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 3px solid #0284c7; margin-bottom: 10px;">
            <h2 style="color: #0f172a; margin-top: 10px; font-size: 22px;">Panel de Administración</h2>
            <p style="color: #64748b; font-size: 13px;">Hospital Dr. José Gregorio Hernández</p>
        </div>

        <!-- Mensajes Flash de error o éxito -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: 600; font-size: 13px; text-align: center; background-color: {{ '#f8d7da' if category == 'error' else '#d1e7dd' }}; color: {{ '#842029' if category == 'error' else '#0f5132' }};">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155;">Usuario:</label>
                <input type="text" name="usuario" placeholder="Ingrese el usuario" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155;">Contraseña:</label>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" name="password" placeholder="Ingrese la contraseña" required style="width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box;">
                    <span onclick="togglePassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; user-select: none;" title="Mostrar / Ocultar contraseña">👁️</span>
                </div>
            </div>

            <button type="submit" style="width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.3s;">Iniciar Sesión</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('index') }}" style="color: #64748b; text-decoration: none; font-size: 13px;">← Volver al sitio web principal</a>
        </div>
    </div>

    <!-- Script para alternar la visibilidad de la contraseña -->
    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
</body>
</html>
